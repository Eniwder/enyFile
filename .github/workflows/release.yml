name: Release

# Push a tag such as v0.1.0 (matching app/Cargo.toml's version) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Build provenance (actions/attest): signs which workflow run and commit built the files.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs dependencies' build scripts: no token left in .git/config for them.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
      - name: Check version
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
      - name: Test
        run: cargo test --release --locked --manifest-path app/Cargo.toml
      - name: Build
        run: cargo build --release --locked --bin enyfile --manifest-path app/Cargo.toml
      - name: Package
        run: |
          $name = "enyFile-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item app/target/release/enyfile.exe, LICENSE, COPYING, README.md -Destination $name
          # The agent's memory sits beside the exe from the start, like config.json.
          New-Item -ItemType Directory -Path "$name/agent" | Out-Null
          Copy-Item app/agent/memory.md -Destination "$name/agent"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          # sha256sum's format: `sha256sum -c` reads it, and the hash is easy to compare by eye.
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          [IO.File]::WriteAllText("$name.zip.sha256", "$hash *$name.zip`n")
          "ASSET=$name.zip" >> $env:GITHUB_ENV
          "EXE=$name/enyfile.exe" >> $env:GITHUB_ENV
      # Checked with `gh attestation verify <file> -R Eniwder/enyFile` (the zip or the exe).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.EXE }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Releases are immutable once published: the zip goes onto a draft first.
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" --repo $env:GITHUB_REPOSITORY --draft --title "enyFile $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false
